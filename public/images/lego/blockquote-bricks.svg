<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 96" width="16" height="96">
  <!-- Vertical stack of colored bricks for blockquote accent -->
  <defs>
    <linearGradient id="bqr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8151a"/>
      <stop offset="100%" stop-color="#c00e11"/>
    </linearGradient>
    <linearGradient id="bqb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0066dd"/>
      <stop offset="100%" stop-color="#004499"/>
    </linearGradient>
    <linearGradient id="bqy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#d4c520"/>
    </linearGradient>
    <linearGradient id="bqg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00a033"/>
      <stop offset="100%" stop-color="#006e22"/>
    </linearGradient>
  </defs>

  <rect x="1" y="0" width="14" height="22" rx="1.5" fill="url(#bqr)" stroke="#8a0a0d" stroke-width="0.4"/>
  <rect x="1" y="24" width="14" height="22" rx="1.5" fill="url(#bqb)" stroke="#003377" stroke-width="0.4"/>
  <rect x="1" y="48" width="14" height="22" rx="1.5" fill="url(#bqy)" stroke="#b5a81a" stroke-width="0.4"/>
  <rect x="1" y="72" width="14" height="22" rx="1.5" fill="url(#bqg)" stroke="#005a1c" stroke-width="0.4"/>
</svg>
