<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 72" width="60" height="72">
  <!-- Classic LEGO minifigure head - iconic yellow cylinder with face -->
  <defs>
    <linearGradient id="hGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#f6ec35"/>
    </linearGradient>
    <linearGradient id="hStud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="40%" stop-color="#f6ec35"/>
      <stop offset="100%" stop-color="#d4c520"/>
    </linearGradient>
  </defs>

  <!-- Stud on top -->
  <ellipse cx="30" cy="6" rx="9" ry="4" fill="url(#hStud)" stroke="#c4b01a" stroke-width="0.6"/>
  <rect x="21" y="3" width="18" height="4" fill="url(#hStud)"/>
  <ellipse cx="30" cy="3" rx="9" ry="4" fill="url(#hGrad)" stroke="#c4b01a" stroke-width="0.6"/>

  <!-- Head cylinder -->
  <rect x="5" y="8" width="50" height="44" rx="8" fill="url(#hGrad)" stroke="#c4b01a" stroke-width="0.8"/>

  <!-- Face -->
  <circle cx="21" cy="30" r="3.5" fill="#1a1a1a"/>
  <circle cx="39" cy="30" r="3.5" fill="#1a1a1a"/>
  <ellipse cx="21" cy="28.5" rx="1.4" ry="0.9" fill="rgba(255,255,255,0.35)"/>
  <ellipse cx="39" cy="28.5" rx="1.4" ry="0.9" fill="rgba(255,255,255,0.35)"/>
  <path d="M20,42 Q30,52 40,42" fill="none" stroke="#1a1a1a" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Bottom neck connector -->
  <rect x="18" y="52" width="24" height="8" rx="2" fill="url(#hGrad)" stroke="#c4b01a" stroke-width="0.5"/>
  <ellipse cx="30" cy="60" rx="12" ry="4" fill="#d4c520" opacity="0.3"/>
</svg>
