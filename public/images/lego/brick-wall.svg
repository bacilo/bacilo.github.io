<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 32" width="64" height="32">
  <!-- Repeating brick wall pattern - subtle, for backgrounds -->
  <!-- Row 1: two bricks -->
  <rect x="0" y="0" width="30" height="14" rx="1" fill="rgba(0,0,0,0.04)" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <rect x="32" y="0" width="32" height="14" rx="1" fill="rgba(0,0,0,0.04)" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <!-- Row 2: offset bricks -->
  <rect x="-16" y="16" width="30" height="14" rx="1" fill="rgba(0,0,0,0.04)" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <rect x="16" y="16" width="30" height="14" rx="1" fill="rgba(0,0,0,0.04)" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
  <rect x="48" y="16" width="30" height="14" rx="1" fill="rgba(0,0,0,0.04)" stroke="rgba(0,0,0,0.08)" stroke-width="0.5"/>
</svg>
