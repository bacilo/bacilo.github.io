      <stop offset="0%" stop-color="#e8151a"/>
      <stop offset="100%" stop-color="#c00e11"/>
    </linearGradient>
  </defs>
  <rect x="1" y="6" width="18" height="12" rx="1.5" fill="url(#b1)" stroke="#8a0a0d" stroke-width="0.6"/>
  <rect x="6" y="2" width="8" height="5" rx="1" fill="#d11013"/>
  <ellipse cx="10" cy="2" rx="4" ry="2" fill="#e8151a" stroke="#a00d10" stroke-width="0.5"/>
  <ellipse cx="9" cy="1.5" rx="1.5" ry="0.7" fill="rgba(255,255,255,0.25)"/>
