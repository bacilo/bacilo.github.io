<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 16" width="24" height="16">
  <!-- Single 3D LEGO stud - used as repeating pattern -->
  <defs>
    <linearGradient id="studBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,0,0,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.25)"/>
    </linearGradient>
    <radialGradient id="studHighlight" cx="0.4" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Stud cylinder -->
  <ellipse cx="12" cy="10" rx="7" ry="3.5" fill="url(#studBody)"/>
  <rect x="5" y="4" width="14" height="6" fill="url(#studBody)"/>

  <!-- Stud top face -->
  <ellipse cx="12" cy="4" rx="7" ry="3.5" fill="rgba(0,0,0,0.1)" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>

  <!-- Highlight -->
  <ellipse cx="10" cy="3.5" rx="4" ry="1.8" fill="url(#studHighlight)"/>
</svg>
