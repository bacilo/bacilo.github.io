<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Base cobblestone gray -->
  <rect width="16" height="16" fill="#7b7b7b"/>
  <!-- Mortar lines (darker dividers between stones) -->
  <rect x="0" y="5" width="16" height="1" fill="#5a5a5a"/>
  <rect x="0" y="11" width="16" height="1" fill="#5a5a5a"/>
  <rect x="4" y="0" width="1" height="5" fill="#5a5a5a"/>
  <rect x="11" y="0" width="1" height="5" fill="#5a5a5a"/>
  <rect x="2" y="6" width="1" height="5" fill="#5a5a5a"/>
  <rect x="8" y="6" width="1" height="5" fill="#5a5a5a"/>
  <rect x="13" y="6" width="1" height="5" fill="#5a5a5a"/>
  <rect x="5" y="12" width="1" height="4" fill="#5a5a5a"/>
  <rect x="12" y="12" width="1" height="4" fill="#5a5a5a"/>
  <!-- Stone patch highlights (lighter centers) -->
  <rect x="1" y="1" width="2" height="3" fill="#999999"/>
  <rect x="6" y="1" width="4" height="3" fill="#999999"/>
  <rect x="13" y="2" width="2" height="2" fill="#999999"/>
  <rect x="3" y="7" width="4" height="3" fill="#999999"/>
  <rect x="9" y="7" width="3" height="3" fill="#999999"/>
  <rect x="0" y="13" width="4" height="2" fill="#999999"/>
  <rect x="6" y="13" width="5" height="2" fill="#999999"/>
  <rect x="13" y="13" width="3" height="2" fill="#999999"/>
</svg>
