<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Base oak plank brown -->
  <rect width="16" height="16" fill="#a57a4c"/>
  <!-- Darker grain lines as horizontal strips -->
  <rect x="1" y="3" width="14" height="1" fill="#8b6340"/>
  <rect x="1" y="7" width="12" height="1" fill="#8b6340"/>
  <rect x="2" y="11" width="13" height="1" fill="#8b6340"/>
  <rect x="0" y="15" width="10" height="1" fill="#8b6340"/>
  <!-- Plank divider lines (vertical seams) -->
  <rect x="8" y="0" width="1" height="3" fill="#8b6340"/>
  <rect x="8" y="4" width="1" height="3" fill="#8b6340"/>
  <rect x="8" y="8" width="1" height="3" fill="#8b6340"/>
  <rect x="8" y="12" width="1" height="3" fill="#8b6340"/>
  <!-- Lighter highlight pixels scattered -->
  <rect x="3" y="1" width="1" height="1" fill="#bc9060"/>
  <rect x="11" y="5" width="1" height="1" fill="#bc9060"/>
  <rect x="5" y="9" width="1" height="1" fill="#bc9060"/>
  <rect x="13" y="13" width="1" height="1" fill="#bc9060"/>
  <rect x="1" y="13" width="1" height="1" fill="#bc9060"/>
  <rect x="6" y="2" width="1" height="1" fill="#bc9060"/>
</svg>
