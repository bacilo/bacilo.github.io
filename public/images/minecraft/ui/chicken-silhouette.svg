<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Body: 6x5 at x=5, y=7 -->
  <rect x="5" y="7" width="6" height="5" fill="#c8c8c8"/>
  <!-- Head: 3x3 at x=10, y=4 -->
  <rect x="10" y="4" width="3" height="3" fill="#c8c8c8"/>
  <!-- Beak: 1x1 at x=13, y=6 -->
  <rect x="13" y="6" width="1" height="1" fill="#c8c8c8"/>
  <!-- Wing: 2x2 at x=4, y=8 -->
  <rect x="4" y="8" width="2" height="2" fill="#c8c8c8"/>
  <!-- Left foot: 1x2 at x=6, y=12 -->
  <rect x="6" y="12" width="1" height="2" fill="#c8c8c8"/>
  <!-- Right foot: 1x2 at x=9, y=12 -->
  <rect x="9" y="12" width="1" height="2" fill="#c8c8c8"/>
</svg>
