<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Same heart shape as heart-full but flat gray (no highlights) -->
  <!-- Top row bumps -->
  <rect x="2" y="2" width="3" height="1" fill="#555555"/>
  <rect x="9" y="2" width="3" height="1" fill="#555555"/>
  <!-- Left bump / right bump rows -->
  <rect x="2" y="3" width="4" height="1" fill="#555555"/>
  <rect x="9" y="3" width="4" height="1" fill="#555555"/>
  <!-- Middle row: full width heart -->
  <rect x="1" y="4" width="14" height="1" fill="#555555"/>
  <rect x="1" y="5" width="14" height="1" fill="#555555"/>
  <rect x="1" y="6" width="14" height="1" fill="#555555"/>
  <rect x="1" y="7" width="14" height="1" fill="#555555"/>
  <!-- Tapering toward point -->
  <rect x="2" y="8" width="12" height="1" fill="#555555"/>
  <rect x="3" y="9" width="10" height="1" fill="#555555"/>
  <rect x="4" y="10" width="8" height="1" fill="#555555"/>
  <rect x="5" y="11" width="6" height="1" fill="#555555"/>
  <rect x="6" y="12" width="4" height="1" fill="#555555"/>
  <rect x="7" y="13" width="2" height="1" fill="#555555"/>
</svg>
