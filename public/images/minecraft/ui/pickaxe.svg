<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Pick head: stone gray pointed left end -->
  <rect x="0" y="5" width="2" height="2" fill="#c6c6c6"/>
  <!-- Pick head: thick middle section -->
  <rect x="2" y="4" width="4" height="4" fill="#c6c6c6"/>
  <!-- Pick head: pointed right end top -->
  <rect x="6" y="3" width="2" height="2" fill="#c6c6c6"/>
  <!-- Handle: brown diagonal shaft going down-right -->
  <rect x="6" y="6" width="2" height="2" fill="#866043"/>
  <rect x="8" y="8" width="2" height="2" fill="#866043"/>
  <rect x="10" y="10" width="2" height="2" fill="#866043"/>
  <rect x="12" y="12" width="2" height="2" fill="#866043"/>
</svg>
