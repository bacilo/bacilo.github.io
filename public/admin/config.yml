backend:
  name: github
  repo: bacilo/bacilo.github.io
  branch: master

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: settings
    label: "Site Settings"
    files:
      - name: site
        label: "Site Settings"
        file: "src/data/site.json"
        fields:
          - label: "Site"
            name: "site"
            widget: "object"
            fields:
              - { label: "Title", name: "title", widget: "string" }
              - { label: "Description", name: "description", widget: "string" }
          - label: "Author"
            name: "author"
            widget: "object"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Bio", name: "bio", widget: "string" }
              - { label: "Avatar", name: "avatar", widget: "image" }
              - { label: "Location", name: "location", widget: "string" }
          - label: "Social"
            name: "social"
            widget: "object"
            fields:
              - { label: "Twitter", name: "twitter", widget: "string", required: false }
              - { label: "GitHub", name: "github", widget: "string", required: false }
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
          - label: "Academic"
            name: "academic"
            widget: "object"
            fields:
              - { label: "Google Scholar URL", name: "googleScholar", widget: "string", required: false }
              - { label: "ORCID URL", name: "orcid", widget: "string", required: false }
          - label: "CV Sections"
            name: "cv"
            widget: "object"
            fields:
              - { label: "Show Education", name: "showEducation", widget: "boolean", default: true }
              - { label: "Show Work Experience", name: "showWorkExperience", widget: "boolean", default: true }
              - { label: "Show Skills", name: "showSkills", widget: "boolean", default: true }
              - { label: "Show Publications", name: "showPublications", widget: "boolean", default: true }
              - { label: "Show Talks", name: "showTalks", widget: "boolean", default: true }
              - { label: "Show Teaching", name: "showTeaching", widget: "boolean", default: true }
              - { label: "Show Service", name: "showService", widget: "boolean", default: true }

  - name: pages
    label: "Pages"
    files:
      - name: home
        label: "Home Page"
        file: "src/content/pages/home.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Body", name: "body", widget: "markdown" }

  - name: posts
    label: "Blog Posts"
    folder: "src/content/posts"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    # Schema mirrors src/content.config.ts -- update both when changing fields
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Date", name: "date", widget: "datetime", required: true, date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Permalink", name: "permalink", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: true }

  - name: publications
    label: "Publications"
    folder: "src/content/publications"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    # Schema mirrors src/content.config.ts -- update both when changing fields
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Collection", name: "collection", widget: "hidden", default: "publications" }
      - { label: "Permalink", name: "permalink", widget: "string", required: true }
      - { label: "Date", name: "date", widget: "datetime", required: true, date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Venue", name: "venue", widget: "string", required: true }
      - { label: "Citation", name: "citation", widget: "text", required: true }
      - { label: "Paper URL", name: "paperurl", widget: "string", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: true }

  - name: talks
    label: "Talks"
    folder: "src/content/talks"
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    # Schema mirrors src/content.config.ts -- update both when changing fields
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Collection", name: "collection", widget: "hidden", default: "talks" }
      - { label: "Type", name: "type", widget: "string", required: true }
      - { label: "Permalink", name: "permalink", widget: "string", required: true }
      - { label: "Venue", name: "venue", widget: "string", required: true }
      - { label: "Date", name: "date", widget: "datetime", required: true, date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Location", name: "location", widget: "string", required: true }
      - { label: "Body", name: "body", widget: "markdown", required: true }

  - name: portfolio
    label: "Portfolio"
    folder: "src/content/portfolio"
    create: true
    delete: true
    slug: "{{slug}}"
    # Schema mirrors src/content.config.ts -- update both when changing fields
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Excerpt", name: "excerpt", widget: "text", required: false }
      - { label: "Image", name: "image", widget: "image", required: false }
      - { label: "Collection", name: "collection", widget: "hidden", default: "portfolio" }
      - { label: "Repository URL", name: "repoUrl", widget: "string", required: false }
      - { label: "Demo URL", name: "demoUrl", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Playground URL", name: "playgroundUrl", widget: "string", required: false }
      - label: "Stats Display"
        name: "statsDisplay"
        widget: "select"
        options: ["stars", "downloads", "both", "none"]
        default: "stars"
        required: false
        hint: "Which GitHub stats to display on the portfolio card"
      - label: "npm Package Name"
        name: "npmPackage"
        widget: "string"
        required: false
        hint: "npm package name for download stats (e.g., 'my-package')"
      - label: "CodePen ID"
        name: "codepenId"
        widget: "string"
        required: false
        hint: "CodePen pen ID for embedded demo (e.g., 'abc123')"
      - label: "StackBlitz Project ID"
        name: "stackblitzId"
        widget: "string"
        required: false
        hint: "StackBlitz project ID for embedded editor (e.g., 'my-project')"
      - { label: "Body", name: "body", widget: "markdown", required: true }
